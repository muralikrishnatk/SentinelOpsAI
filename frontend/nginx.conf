server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + actuator to the backend container
  location /api/ {
    proxy_pass http://backend:8080;
  }
  location /actuator/ {
    proxy_pass http://backend:8080;
  }
}
