# Prometheus scrapes the Sentinel backend's Micrometer endpoint. The backend then
# queries Prometheus back (via its HTTP API) to compute SLIs — a real, two-way
# telemetry loop you can inspect at http://localhost:9090.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sentinel-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
